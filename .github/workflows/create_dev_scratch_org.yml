name: Create Dev Scratch Org (Source Deploy)

# Creates a scratch org for development / build testing: installs the
# Accounting Seed Financial Suite (1GP) dependency, then deploys ASRamp
# source straight from the branch.
#
# The org IS namespaced with AcctSeedRamp (from sfdx-project.json), so
# deployed source behaves the way it will once packaged. Contrast with
# create_qa_scratch_org.yml, which creates a namespace-free org and
# installs the managed package instead.
#
# Requires the following repo secrets:
#   INT_USER_SFDX_AUTH_URL - SFDX auth URL for the Dev Hub
#   SLACK_BOT_TOKEN_NEW    - (optional) Slack bot token for credential drop
#   SLACK_CHANNEL_ID       - (optional) Slack channel to post credentials to

on:
  workflow_dispatch:
    inputs:
      duration_days:
        description: 'Scratch org lifetime in days (1-30)'
        default: '7'
        required: true
      fs_version_id:
        description: 'FS package version Id (blank = dependency in sfdx-project.json)'
        default: ''
        required: false
      run_apex_tests:
        description: 'Run all local Apex tests after deploy (true/false)'
        default: 'false'
        required: true
      org_suffix:
        description: 'Org alias suffix (blank = GitHub actor)'
        default: ''
        required: false
      verification_email:
        description: 'Admin email address (for login codes)'
        default: ''
        required: false

env:
  DEVHUB_SFDX_AUTH_URL: ${{ secrets.INT_USER_SFDX_AUTH_URL }}
  SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

jobs:
  create_dev_scratch_org:
    name: Create Dev Scratch Org
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── Step 1: Checkout the branch this workflow was run from ──────
      - uses: actions/checkout@v4

      # ── Step 2: Install SF CLI and authenticate to the Dev Hub ──────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # The SF CLI's HTTP stack (@jsforce/jsforce-node -> undici@8)
          # requires Node >= 22.19.0.
          node-version: "22"

      - name: Install SF CLI and auth Dev Hub
        run: |
          set -euo pipefail
          npm install --global @salesforce/cli
          sf --version
          if [ -z "${DEVHUB_SFDX_AUTH_URL:-}" ]; then
            echo "ERROR: INT_USER_SFDX_AUTH_URL secret is not set; cannot create scratch org." >&2
            exit 1
          fi
          printf '%s' "$DEVHUB_SFDX_AUTH_URL" > devhub_auth.txt
          sf org login sfdx-url --sfdx-url-file devhub_auth.txt --set-default-dev-hub --alias devhub
          rm -f devhub_auth.txt

      # ── Step 3: Resolve the Financial Suite dependency ──────────────
      - name: Resolve Financial Suite version
        id: versions
        env:
          FS_VERSION_INPUT: ${{ github.event.inputs.fs_version_id }}
        run: |
          set -euo pipefail
          if [ -n "$FS_VERSION_INPUT" ]; then
            FS_ID="$FS_VERSION_INPUT"
            FS_LABEL="$FS_VERSION_INPUT (manual override)"
          else
            FS_ALIAS=$(jq -r '.packageDirectories[0].dependencies[0].package' sfdx-project.json)
            FS_ID=$(jq -r --arg a "$FS_ALIAS" '.packageAliases[$a] // ""' sfdx-project.json)
            FS_LABEL="$FS_ALIAS"
            if [ -z "$FS_ID" ]; then
              echo "ERROR: no packageAliases entry for dependency '$FS_ALIAS'." >&2
              exit 1
            fi
          fi
          echo "FS dependency: $FS_LABEL -> $FS_ID"
          echo "fs_id=$FS_ID" >> "$GITHUB_OUTPUT"
          echo "fs_label=$FS_LABEL" >> "$GITHUB_OUTPUT"

      # ── Step 4: Work out the org alias ──────────────────────────────
      - name: Resolve org naming
        id: naming
        env:
          ORG_SUFFIX: ${{ github.event.inputs.org_suffix }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          SUFFIX="${ORG_SUFFIX:-$GH_ACTOR}"
          # Aliases allow letters, digits, underscore and hyphen only.
          SUFFIX=$(printf '%s' "$SUFFIX" | tr -cd '[:alnum:]_-')
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "alias=asramp_dev_$SUFFIX" >> "$GITHUB_OUTPUT"

      # ── Step 5: Scratch org definition tweaks ───────────────────────
      - name: Apply scratch org definition overrides
        env:
          VERIFICATION_EMAIL: ${{ github.event.inputs.verification_email }}
          ORG_NAME_SUFFIX: ${{ steps.naming.outputs.suffix }}
        run: |
          set -euo pipefail
          python3 - "$ORG_NAME_SUFFIX" <<'PYEOF'
          import json, os, sys

          suffix = sys.argv[1]
          path = "config/project-scratch-def.json"
          with open(path) as f:
              definition = json.load(f)

          definition["orgName"] = f"ASRamp Dev - {suffix}"
          email = os.environ.get("VERIFICATION_EMAIL", "").strip()
          if email:
              definition["adminEmail"] = email

          with open(path, "w") as f:
              json.dump(definition, f, indent=2)
          print(json.dumps(definition, indent=2))
          PYEOF

      # ── Step 6: Create the namespaced scratch org ───────────────────
      - name: Create scratch org
        id: scratch-org
        env:
          ALIAS: ${{ steps.naming.outputs.alias }}
          DURATION_DAYS: ${{ github.event.inputs.duration_days }}
        run: |
          set -euo pipefail
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"

          # No --no-namespace here: the org picks up the AcctSeedRamp namespace
          # from sfdx-project.json (the namespace must be linked to the Dev Hub).
          sf org create scratch \
            --definition-file config/project-scratch-def.json \
            --alias "$ALIAS" \
            --set-default \
            --duration-days "$DURATION_DAYS" \
            --wait 30 \
            --target-dev-hub devhub
          echo "created=true" >> "$GITHUB_OUTPUT"

          sf org display --target-org "$ALIAS" --json \
            | jq -r '"Org namespace: " + (.result.namespace // "none")'

      # ── Step 7: Install the Financial Suite dependency ──────────────
      - name: Install Accounting Seed Financial Suite
        run: |
          set -euo pipefail
          sf package install \
            --package "${{ steps.versions.outputs.fs_id }}" \
            --target-org "${{ steps.scratch-org.outputs.alias }}" \
            --security-type AdminsOnly \
            --wait 60 \
            --publish-wait 30 \
            --no-prompt

      # ── Step 8: Deploy ASRamp source ────────────────────────────────
      - name: Deploy ASRamp source
        run: |
          set -euo pipefail
          sf project deploy start \
            --source-dir force-app/main/default \
            --target-org "${{ steps.scratch-org.outputs.alias }}" \
            --wait 60

      # ── Step 9: Grant permission sets ───────────────────────────────
      - name: Assign permission sets
        continue-on-error: true
        run: |
          ALIAS="${{ steps.scratch-org.outputs.alias }}"
          assign() {
            for name in "$@"; do
              if sf org assign permset --name "$name" --target-org "$ALIAS"; then
                echo "Assigned $name"
                return 0
              fi
            done
            echo "WARNING: could not assign any of: $*"
          }
          assign AcctSeed__AS_Full_Admin AS_Full_Admin
          assign Ramp_Admin

      # ── Step 10: Optional Apex test run ─────────────────────────────
      - name: Run local Apex tests
        if: github.event.inputs.run_apex_tests == 'true'
        run: |
          set -euo pipefail
          mkdir -p reports/unit
          sf apex run test \
            --test-level RunLocalTests \
            --code-coverage \
            --wait 360 \
            --result-format human \
            --output-dir reports/unit \
            --target-org "${{ steps.scratch-org.outputs.alias }}"

      # ── Step 11: Generate a password and collect credentials ────────
      - name: Collect scratch org credentials
        if: steps.scratch-org.outputs.created == 'true'
        run: |
          set -euo pipefail
          ALIAS="${{ steps.scratch-org.outputs.alias }}"
          sf org generate password --target-org "$ALIAS" || \
            echo "WARNING: password generation failed (EnableSetPasswordInApi missing?)"
          sf org display --target-org "$ALIAS" --json \
            | jq '{instanceUrl: .result.instanceUrl, username: .result.username, password: .result.password, orgId: .result.id, namespace: .result.namespace, expirationDate: .result.expirationDate}' \
            > ScratchOrg.json
          cat ScratchOrg.json

      # ── Step 12: Job summary ────────────────────────────────────────
      - name: Write job summary
        if: always() && steps.scratch-org.outputs.created == 'true'
        run: |
          {
            echo "## Dev Scratch Org Ready"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Alias | \`${{ steps.scratch-org.outputs.alias }}\` |"
            echo "| Namespace on org | \`AcctSeedRamp\` |"
            echo "| Branch deployed | \`${{ github.ref_name }}\` |"
            echo "| Financial Suite | ${{ steps.versions.outputs.fs_label }} |"
            echo "| Login URL | $(jq -r '.instanceUrl // "n/a"' ScratchOrg.json 2>/dev/null || echo n/a) |"
            echo "| Username | $(jq -r '.username // "n/a"' ScratchOrg.json 2>/dev/null || echo n/a) |"
            echo "| Password | $(jq -r '.password // "n/a"' ScratchOrg.json 2>/dev/null || echo n/a) |"
            echo "| Expires | $(jq -r '.expirationDate // "n/a"' ScratchOrg.json 2>/dev/null || echo n/a) |"
            echo ""
            echo "Ramp API credentials are **not** in source control (\`Ramp_Credential__mdt\` is gitignored) —"
            echo "deploy them separately before exercising Ramp callouts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload credentials artifact
        if: steps.scratch-org.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dev-scratch-org-${{ github.run_id }}
          path: ScratchOrg.json
          retention-days: 7

      # ── Step 13: Post credentials to Slack (optional) ───────────────
      - name: Upload credentials to Slack
        if: steps.scratch-org.outputs.created == 'true' && env.SLACK_CHANNEL_ID != ''
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: files.uploadV2
          token: ${{ secrets.SLACK_BOT_TOKEN_NEW }}
          payload: |
            channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
            initial_comment: "ASRamp Dev Scratch Org (${{ github.ref_name }}) for ${{ github.actor }}"
            file: "${{ github.workspace }}/ScratchOrg.json"
            filename: "ScratchOrg.json"