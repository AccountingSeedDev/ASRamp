<template>
    <div class="home">
        <!-- ───────── header ───────── -->
        <header class="hdr">
            <div class="lockup">
                <svg class="as-mark" viewBox="0 0 86 96.75" aria-hidden="true">
                    <path d="M29.25 5.25C12.75 5.25 0 18.75 0 35.25 0 90.75 0 90.75 0 90.75 55.5 90.75 55.5 90.75 55.5 90.75 71.25 90.75 85.5 77.25 85.5 60.75 85.5 5.25 85.5 5.25 85.5 5.25L29.25 5.25ZM64.5 52.5C64.5 62.25 57 69.75 47.25 69.75 20.25 69.75 20.25 69.75 20.25 69.75 20.25 43.5 20.25 43.5 20.25 43.5 20.25 33.75 28.5 26.25 37.5 26.25 64.5 26.25 64.5 26.25 64.5 26.25L64.5 52.5Z" fill="#1AA2DC"></path>
                    <path d="M77.25 81C85.5 72.75 85.5 61.5 85.5 61.5 85.5 5.25 85.5 5.25 85.5 5.25 64.5 26.25 64.5 26.25 64.5 26.25 64.5 52.5 64.5 52.5 64.5 52.5 64.5 69.75 49.5 90.75 0 90.75 55.5 90.75 55.5 90.75 55.5 90.75 58.5 90.75 69 90 77.25 81L77.25 81Z" fill="#2874BB"></path>
                    <path d="M42.75 57.75C37.5 57.75 33 53.25 33 48 33 42.75 37.5 38.25 42.75 38.25 45 38.25 52.5 38.25 52.5 38.25 52.5 38.25 52.5 45.75 52.5 48 52.5 53.25 48 57.75 42.75 57.75L42.75 57.75Z" fill="#4CB748"></path>
                </svg>
                <span class="brand-as">Accounting Seed</span>
                <span class="swap">&#8644;</span>
                <span class="ramp-badge">R</span>
                <span class="brand-ramp">Ramp</span>
                <span class="brand-sfx">Integration</span>
            </div>
            <div class="spacer"></div>
            <div class="conn" title={connTitle}>
                <span class={connClass}></span>
                <div class="conn-text">
                    <div class="conn-title">{connLabel}</div>
                    <div class="conn-sub">{business}</div>
                </div>
            </div>
            <button class="btn btn-neutral" onclick={handleRefresh}>
                <lightning-icon icon-name="utility:refresh" size="x-small" alternative-text="Refresh"></lightning-icon>
                <span>Refresh</span>
            </button>
            <button class="btn btn-neutral" data-tab="authorization" onclick={openConfig}>
                <lightning-icon icon-name="utility:settings" size="x-small" alternative-text="Configure"></lightning-icon>
                <span>Configure</span>
            </button>
            <button class="btn btn-primary" onclick={handleSyncAll} disabled={syncAllDisabled}>
                <lightning-icon icon-name="utility:flow" size="x-small" variant="inverse" alternative-text=""></lightning-icon>
                <span>{syncAllLabel}</span>
            </button>
        </header>

        <div class="body">
            <template lwc:if={ready}>
            <!-- ───────── setup banner / health strip ───────── -->
            <template lwc:if={showSetupBanner}>
                <div class="setup">
                    <div class="setup-top">
                        <div class="ring" style={ringStyle}>
                            <div class="ring-num">{donePct}%</div>
                        </div>
                        <div class="setup-copy">
                            <div class="eyebrow">Finish setup</div>
                            <div class="setup-title">Let’s connect Ramp to Accounting Seed</div>
                            <div class="setup-sub">{doneCountLabel} · Up next: <strong>{nextStepTitle}</strong></div>
                        </div>
                        <button class="btn btn-cyan" onclick={openConfigNext}>Continue setup</button>
                    </div>
                    <div class="setup-bar"><div class="setup-bar-fill" style={progressStyle}></div></div>
                    <div class="steps">
                        <template for:each={steps} for:item="s">
                            <button key={s.id} class={s.cls} data-step={s.id} data-tab={s.tab} onclick={openConfig}>
                                <div class={s.badgeCls}>
                                    <template lwc:if={s.isDone}>&#10003;</template>
                                    <template lwc:else>{s.n}</template>
                                </div>
                                <div class="step-text">
                                    <div class="step-title">{s.title}</div>
                                    <div class="step-desc">{s.descr}</div>
                                </div>
                            </button>
                        </template>
                    </div>
                </div>
            </template>
            <template lwc:else>
                <div class={healthClass}>
                    <lightning-icon icon-name={healthIcon} size="small" class="strip-icon"></lightning-icon>
                    <div class="strip-title">{healthTitle}</div>
                    <div class="strip-detail">{healthDetail}</div>
                    <div class="spacer"></div>
                    <template lwc:if={hasFailures}>
                        <button class="btn btn-danger sm" onclick={reviewErrors}>Review errors</button>
                    </template>
                </div>
            </template>

            <!-- ───────── KPI row ───────── -->
            <div class="kpis">
                <template for:each={kpis} for:item="k">
                    <div key={k.key} class="kpi">
                        <div class="kpi-label">{k.label}</div>
                        <div class="kpi-value">{k.value}</div>
                        <div class={k.toneCls}>{k.sub}</div>
                    </div>
                </template>
            </div>

            <!-- ───────── sync pipelines (tabbed: Transaction / Master data) ───────── -->
            <div class="sec-label">
                <lightning-icon icon-name="utility:flow" size="x-small"></lightning-icon>
                <span>Sync pipelines</span>
                <div class="spacer"></div>
            </div>
            <div class="ptabs">
                <button class={txnTabCls} data-id="transaction" onclick={selectPipeTab}>
                    <lightning-icon icon-name="utility:money" size="xx-small"></lightning-icon>
                    <span>Transaction</span>
                </button>
                <button class={masterTabCls} data-id="master" onclick={selectPipeTab}>
                    <lightning-icon icon-name="utility:database" size="xx-small"></lightning-icon>
                    <span>Master data</span>
                </button>
            </div>
            <div class="ptab-panel">
            <div class="pgrid">
                <template for:each={activePipelines} for:item="p">
                    <div key={p.id} class={p.cardCls}>
                        <div class="pcard-top">
                            <div class={p.tintCls}>
                                <lightning-icon icon-name={p.iconName} size="small"></lightning-icon>
                            </div>
                            <div class="pcard-head">
                                <div class="pcard-name-row">
                                    <span class="pcard-name">{p.name}</span>
                                </div>
                                <div class="pcard-flow">{p.fromLabel} &#8594; {p.toLabel} · <span class="pcard-target">{p.target}</span></div>
                            </div>
                            <span class={p.statusCls}>{p.statusLabel}</span>
                        </div>

                        <template lwc:if={p.notEnabled}>
                            <div class="pcard-empty">{p.blurb}</div>
                        </template>
                        <template lwc:else>
                            <div class="counts">
                                <template for:each={p.counts} for:item="c">
                                    <div key={c.key} class="count">
                                        <div class={c.cls}>{c.n}</div>
                                        <div class="count-label">{c.label}</div>
                                    </div>
                                </template>
                            </div>
                            <template lwc:if={p.hasLastRun}>
                                <div class="pcard-lastrun">{p.lastRun}</div>
                            </template>
                        </template>

                        <template lwc:if={p.schedActive}>
                            <div class="sched-chip">
                                <lightning-icon icon-name="utility:clock" size="xx-small"></lightning-icon>
                                <span>{p.schedSummary}</span>
                                <template lwc:if={p.schedNext}><span class="sched-next">· next {p.schedNext}</span></template>
                            </div>
                        </template>

                        <div class="pcard-foot">
                            <span class="records">{p.records}</span>
                            <div class="spacer"></div>
                            <template lwc:if={p.implemented}>
                                <button class="btn btn-neutral sm" data-id={p.id} onclick={openSchedule}>
                                    <lightning-icon icon-name="utility:clock" size="xx-small"></lightning-icon>
                                    <span>{p.schedBtnLabel}</span>
                                </button>
                            </template>
                            <template lwc:if={p.showSync}>
                                <button class="btn btn-secondary sm" data-id={p.id} data-action={p.action}
                                        onclick={handlePipeSync} disabled={p.syncDisabled}>
                                    <lightning-icon icon-name="utility:sync" size="xx-small"></lightning-icon>
                                    <span>{p.syncLabel}</span>
                                </button>
                            </template>
                        </div>

                        <template lwc:if={p.scheduleOpen}>
                            <div class="sched-panel">
                                <div class="sched-row">
                                    <label class="sched-label">Frequency</label>
                                    <select class="sched-select" onchange={onFreqChange}>
                                        <template for:each={freqOptions} for:item="o">
                                            <option key={o.value} value={o.value} selected={o.selected}>{o.label}</option>
                                        </template>
                                    </select>
                                </div>
                                <template lwc:if={showHour}>
                                    <div class="sched-row">
                                        <label class="sched-label">Time of day</label>
                                        <select class="sched-select" onchange={onHourChange}>
                                            <template for:each={hourOptions} for:item="o">
                                                <option key={o.value} value={o.value} selected={o.selected}>{o.label}</option>
                                            </template>
                                        </select>
                                    </div>
                                </template>
                                <div class="sched-actions">
                                    <button class="btn btn-secondary sm" data-id={p.id} onclick={saveSchedule} disabled={schedBusy}>Save schedule</button>
                                    <template lwc:if={p.schedActive}>
                                        <button class="btn btn-danger sm" data-id={p.id} onclick={clearSchedule} disabled={schedBusy}>Clear</button>
                                    </template>
                                    <button class="btn btn-neutral sm" onclick={closeSchedule}>Cancel</button>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>

            <!-- ───────── recent sync runs (Automated Job Results) ───────── -->
            <div class="sec-label">
                <lightning-icon icon-name="utility:metrics" size="x-small"></lightning-icon>
                <span>Recent sync runs</span>
                <div class="spacer"></div>
                <span class="sec-hint">from Automated Job Results</span>
            </div>
            <div class="jgrid">
                <template for:each={activeJobs} for:item="j">
                    <div key={j.jobType} class="jcard">
                        <div class="jcard-top">
                            <span class="jcard-name">{j.label}</span>
                            <span class={j.pillCls}>{j.pillLabel}</span>
                        </div>
                        <div class="jcard-nums">
                            <div class="jm"><div class="jm-num">{j.processedN}</div><div class="jm-label">Processed</div></div>
                            <div class="jm"><div class="jm-num good">{j.succeededN}</div><div class="jm-label">Succeeded</div></div>
                            <div class="jm"><div class={j.failedCls}>{j.failedN}</div><div class="jm-label">Failed</div></div>
                        </div>
                        <div class="jcard-foot">
                            <span>Last run: {j.lastRunLabel}</span>
                            <template lwc:if={j.hasRecord}>
                                <div class="spacer"></div>
                                <button class="link-btn" data-id={j.recordId} onclick={viewJobResult}>
                                    View details
                                    <lightning-icon icon-name="utility:forward" size="xx-small"></lightning-icon>
                                </button>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <!-- ───────── error queue (active group) ───────── -->
            <div class="sec-label">
                <lightning-icon icon-name="utility:error" size="x-small"></lightning-icon>
                <span>Error queue</span>
                <div class="spacer"></div>
                <template lwc:if={activeHasFailures}><span class="sec-hint">{activeFailuresCount} to resolve</span></template>
            </div>
            <div class="lower-body">
                <template lwc:if={activeHasFailures}>
                    <table class="tbl">
                        <thead>
                            <tr>
                                <th>Record</th><th>Ramp object</th><th>Reason</th><th class="ta-r"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={activeFailures} for:item="f">
                                <tr key={f.id}>
                                    <td>
                                        <div class="cell-strong">{f.name}</div>
                                        <div class="cell-sub">{f.objType}</div>
                                    </td>
                                    <td class="mono">{f.rampId}</td>
                                    <td class="reason">{f.error}</td>
                                    <td class="ta-r">
                                        <button class="btn btn-neutral sm" data-id={f.pipe} data-action={f.action} onclick={handlePipeSync}>
                                            <lightning-icon icon-name="utility:redo" size="xx-small"></lightning-icon>
                                            <span>Retry</span>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template lwc:else>
                    <div class="empty">
                        <lightning-icon icon-name="utility:success" size="small"></lightning-icon>
                        <div class="empty-title">No errors in this queue</div>
                        <div class="empty-sub">Every record in this group posted cleanly and was acknowledged by Ramp.</div>
                    </div>
                </template>
            </div>
            </div>
            </template>
            <template lwc:else>
                <div class="body-loading">
                    <lightning-spinner alternative-text="Loading Ramp home" size="medium"></lightning-spinner>
                </div>
            </template>
        </div>

        <!-- ───────── configuration modal ───────── -->
        <template lwc:if={showConfig}>
            <div class="modal-backdrop" onclick={closeConfig}>
                <div class="modal-panel" onclick={stopProp} role="dialog" aria-modal="true" aria-label="Ramp configuration">
                    <header class="modal-hdr">
                        <div class="modal-title-wrap">
                            <lightning-icon icon-name="utility:settings" size="small"></lightning-icon>
                            <div>
                                <div class="modal-title">Setup &amp; configuration</div>
                                <div class="modal-sub">Authorize, map master data and tune posting — without leaving the dashboard.</div>
                            </div>
                        </div>
                        <button class="modal-close" onclick={closeConfig} title="Close" aria-label="Close">
                            <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        </button>
                    </header>
                    <div class="modal-body">
                        <c-ramp-configuration active-tab={configTab}></c-ramp-configuration>
                    </div>
                    <footer class="modal-foot">
                        <button class="btn btn-primary" onclick={closeConfig}>Done</button>
                    </footer>
                </div>
            </div>
        </template>
    </div>
</template>
